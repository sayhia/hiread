name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - ".github/workflows/release*.yml"
      - ".github/scripts/**"
  pull_request:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - ".github/workflows/release*.yml"
      - ".github/scripts/**"

# A new push should kill the previous CI, not let a hung apt job burn 6 hours.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Type-check, build & test frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # `build` runs vue-tsc (type-check) then vite build. The wails-generated
      # bindings under frontend/bindings are committed, so this needs no wails3.
      - name: Build (vue-tsc + vite)
        run: npm run build

      - name: Test (vitest)
        run: npm test

  go:
    name: vet, test & build Go
    # ubuntu-latest (x64) hangs for hours on libgtk-4-dev / libwebkitgtk-6.0-dev
    # and the default job timeout is 6h — that is what burned ~1700 Linux minutes.
    # ARM apt works and is billed cheaper.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - name: Install system dependencies (GTK4 + WebKitGTK 6.0)
        run: |
          echo 'man-db man-db/auto-update boolean false' | sudo debconf-set-selections || true
          sudo rm -f /var/lib/man-db/auto-update
          sudo DEBIAN_FRONTEND=noninteractive apt-get \
            -o Acquire::Retries=3 -o Dpkg::Use-Pty=0 update
          sudo DEBIAN_FRONTEND=noninteractive apt-get \
            -o Acquire::Retries=3 -o Dpkg::Use-Pty=0 \
            install -y --no-install-recommends \
              libgtk-4-dev libwebkitgtk-6.0-dev

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # main.go has `//go:embed all:frontend/dist`, but the dir is gitignored.
      - name: Stub embedded frontend assets
        run: |
          mkdir -p frontend/dist
          echo '<!doctype html><title>ci stub</title>' > frontend/dist/index.html

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      # Build the app package only — `./...` would also try to link the Wails
      # iOS scaffold under build/ios (a main package with no main func) and fail.
      - name: Build
        run: go build .
