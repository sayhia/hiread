name: Release Linux amd64

# Rebuild only the Linux x64 desktop packages and attach them to an existing
# GitHub Release. Runs on ARM (whose apt works) and builds amd64 in Docker
# because ubuntu-24.04 x64 runners hang installing GTK/WebKit headers.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to upload to"
        required: true
        default: "v0.1.0"
        type: string

permissions:
  contents: write

env:
  WAILS3_VERSION: v3.0.0-alpha2.103
  APPIMAGE_EXTRACT_AND_RUN: "1"

jobs:
  package:
    name: Package linux-amd64 (docker)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5

      - name: Resolve version
        id: v
        run: |
          TAG="${{ inputs.tag }}"
          [[ "${TAG}" == v* ]] || TAG="v${TAG}"
          echo "tag=${TAG}" >> "${GITHUB_OUTPUT}"
          echo "version=${TAG#v}" >> "${GITHUB_OUTPUT}"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build packages in linux/amd64 container
        env:
          HIREAD_VERSION: ${{ steps.v.outputs.version }}
        run: |
          chmod +x .github/scripts/package-linux.sh
          docker run --rm --platform linux/amd64 \
            -v "${PWD}:/src" -w /src \
            -e HIREAD_VERSION \
            -e WAILS3_VERSION \
            -e APPIMAGE_EXTRACT_AND_RUN \
            ubuntu:24.04 bash /src/.github/scripts/package-linux.sh

      - name: Upload to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.v.outputs.tag }}
        run: |
          set -euo pipefail
          ls -lh dist
          gh release upload "${TAG}" dist/* --clobber
          tmp=$(mktemp)
          gh release download "${TAG}" --pattern SHA256SUMS.txt --output "${tmp}" || true
          {
            if [[ -s "${tmp}" ]]; then
              grep -v 'Hiread-.*-linux-amd64' "${tmp}" || true
            fi
            (cd dist && sha256sum *)
          } | sort -k2 > SHA256SUMS.txt
          gh release upload "${TAG}" SHA256SUMS.txt --clobber
          gh release view "${TAG}"
