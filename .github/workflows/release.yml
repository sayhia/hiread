name: Release

# Push a version tag (`git tag v0.1.0 && git push origin v0.1.0`) to build
# native installers on each OS and attach them to a GitHub Release.
# macOS bundles are ad-hoc signed only (no Developer ID / notarization) —
# Gatekeeper will warn until that is wired up with secrets.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.1.0). Empty = prerelease from this SHA."
        required: false
        type: string
      platforms:
        description: "Comma-separated package labels to build (e.g. linux-amd64). Empty = all."
        required: false
        type: string

concurrency:
  group: release-${{ github.ref }}
  # A retry must kill a stuck prior run. Default job timeout is 6h; one hung
  # ubuntu-latest GTK apt was enough to empty the monthly private-repo quota.
  cancel-in-progress: true

permissions:
  contents: write

env:
  WAILS3_VERSION: v3.0.0-alpha2.103
  APPIMAGE_EXTRACT_AND_RUN: "1"

jobs:
  meta:
    name: Resolve version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.v.outputs.version }}
      tag: ${{ steps.v.outputs.tag }}
      prerelease: ${{ steps.v.outputs.prerelease }}
    steps:
      - id: v
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF_NAME}"
          elif [[ -n "${{ inputs.tag }}" ]]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="v0.0.0-dev.${GITHUB_SHA::7}"
          fi
          if [[ "${TAG}" != v* ]]; then
            TAG="v${TAG}"
          fi
          VERSION="${TAG#v}"
          PRE=false
          if [[ "${VERSION}" == *-* ]]; then
            PRE=true
          fi
          echo "tag=${TAG}" >> "${GITHUB_OUTPUT}"
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
          echo "prerelease=${PRE}" >> "${GITHUB_OUTPUT}"
          echo "Release ${TAG} (version ${VERSION}, prerelease=${PRE})"

  package:
    name: Package ${{ matrix.label }}
    needs: meta
    # Rebuilding a single platform (workflow_dispatch inputs.platforms) must not
    # re-run the whole matrix — each skipped job counts as success.
    if: ${{ inputs.platforms == '' || contains(inputs.platforms, matrix.label) }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            label: darwin-arm64
            kind: macos
            arch: arm64
            mac_name: AppleSilicon
          - os: macos-latest
            label: darwin-amd64
            kind: macos
            arch: amd64
            mac_name: Intel
          # ubuntu-24.04 x64 hangs installing GTK/WebKit -dev. Cross-compile
          # amd64 on the ARM runner (native Go + amd64 GTK sysroot).
          - os: ubuntu-24.04-arm
            label: linux-amd64
            kind: linux-amd64-cross
          - os: ubuntu-24.04-arm
            label: linux-arm64
            kind: linux
          - os: windows-latest
            label: windows-amd64
            kind: windows
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    env:
      HIREAD_VERSION: ${{ needs.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v5

      - name: Stamp version into packaging metadata
        shell: bash
        env:
          VERSION: ${{ needs.meta.outputs.version }}
        run: |
          python3 - <<'PY'
          import os, pathlib, re, sys

          version = os.environ["VERSION"]

          def sub(path: str, pattern: str, repl: str, count: int = 0) -> None:
              p = pathlib.Path(path)
              text = p.read_text(encoding="utf-8")
              new, n = re.subn(pattern, repl, text, count=count, flags=re.M)
              if n == 0:
                  sys.exit(f"no match in {path}: {pattern}")
              p.write_text(new, encoding="utf-8")

          sub("services/update.go", r'var appVersion = "[^"]+"', f'var appVersion = "{version}"')
          sub(
              "build/darwin/Info.plist",
              r"(<key>CFBundleVersion</key>\s*<string>)[^<]+",
              rf"\g<1>{version}",
          )
          sub(
              "build/darwin/Info.plist",
              r"(<key>CFBundleShortVersionString</key>\s*<string>)[^<]+",
              rf"\g<1>{version}",
          )
          sub("build/windows/info.json", r'"file_version": "[^"]+"', f'"file_version": "{version}"')
          sub("build/windows/info.json", r'"ProductVersion": "[^"]+"', f'"ProductVersion": "{version}"')
          sub("build/linux/nfpm/nfpm.yaml", r'^version:\s*".*"', f'version: "{version}"', count=1)
          print(f"stamped {version}")
          PY

      # main.go embeds frontend/dist (gitignored). Bindings generation compiles
      # the Go package before Vite has written the real dist.
      - name: Stub embedded frontend assets
        shell: bash
        run: |
          mkdir -p frontend/dist
          echo '<!doctype html><title>release stub</title>' > frontend/dist/index.html

      - name: Install Linux system dependencies
        if: matrix.kind == 'linux'
        run: |
          set -euxo pipefail
          # webkit/gtk -dev pulls hundreds of man pages; man-db's trigger can
          # sit silent for 10–20 minutes and looks like a hung apt.
          echo 'man-db man-db/auto-update boolean false' | sudo debconf-set-selections || true
          sudo rm -f /var/lib/man-db/auto-update
          sudo mkdir -p /etc/needrestart/conf.d
          echo '$nrconf{restart} = "a";' | sudo tee /etc/needrestart/conf.d/ci.conf >/dev/null || true
          export DEBIAN_FRONTEND=noninteractive
          sudo apt-get \
            -o Acquire::ForceIPv4=true \
            -o Acquire::Retries=5 \
            -o Acquire::http::Timeout=30 \
            -o Dpkg::Use-Pty=0 \
            update
          sudo apt-get \
            -o Acquire::ForceIPv4=true \
            -o Acquire::Retries=5 \
            -o Acquire::http::Timeout=30 \
            -o Dpkg::Use-Pty=0 \
            -o Dpkg::Options::=--force-confdef \
            -o Dpkg::Options::=--force-confold \
            install -y --no-install-recommends \
              libgtk-4-dev \
              libwebkitgtk-6.0-dev \
              libfuse2 \
              rpm \
              ca-certificates \
              wget

      - name: Install NSIS (Windows installer)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install nsis -y --no-progress
          $dirs = @(
            "${env:ProgramFiles(x86)}\NSIS",
            "${env:ProgramFiles}\NSIS"
          )
          $found = $false
          foreach ($dir in $dirs) {
            if (Test-Path (Join-Path $dir "makensis.exe")) {
              Add-Content -Path $env:GITHUB_PATH -Value $dir
              Write-Host "NSIS at $dir"
              $found = $true
            }
          }
          if (-not $found) {
            Get-ChildItem "C:\Program Files*","C:\ProgramData\chocolatey\lib" -Recurse -Filter makensis.exe -ErrorAction SilentlyContinue |
              Select-Object -First 5 -ExpandProperty FullName
            throw "makensis.exe not found after installing NSIS"
          }

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Wails3 CLI and Task
        if: matrix.kind != 'linux-amd64-cross'
        shell: bash
        run: |
          go install "github.com/wailsapp/wails/v3/cmd/wails3@${WAILS3_VERSION}"
          go install github.com/go-task/task/v3/cmd/task@latest
          echo "$(go env GOPATH)/bin" >> "${GITHUB_PATH}"

      - name: Cross-compile linux-amd64 packages
        if: matrix.kind == 'linux-amd64-cross'
        run: |
          chmod +x .github/scripts/package-linux.sh
          .github/scripts/package-linux.sh

      - name: Package macOS app
        if: matrix.kind == 'macos'
        run: |
          task darwin:package ARCH="${{ matrix.arch }}" VERSION="${HIREAD_VERSION}"
          echo "archs=$(lipo -archs bin/hiread.app/Contents/MacOS/hiread)"
          lipo -archs bin/hiread.app/Contents/MacOS/hiread | grep -q "${{ matrix.arch == 'amd64' && 'x86_64' || 'arm64' }}"

      - name: Build Linux binary and installers
        if: matrix.kind == 'linux'
        run: |
          set -euo pipefail
          export GOARCH
          GOARCH="$(go env GOARCH)"
          task build VERSION="${HIREAD_VERSION}"
          task linux:generate:dotdesktop
          task linux:generate:deb
          task linux:generate:rpm
          task linux:generate:aur || true

      - name: Build Linux AppImage
        if: matrix.kind == 'linux'
        continue-on-error: true
        run: task linux:create:appimage

      - name: Build Windows binary
        if: matrix.kind == 'windows'
        run: task build VERSION="${HIREAD_VERSION}"

      - name: Build Windows NSIS installer
        if: matrix.kind == 'windows'
        continue-on-error: true
        run: |
          where.exe makensis
          task windows:create:nsis:installer INSTALL_SCOPE=user

      - name: Collect artifacts
        if: matrix.kind != 'linux-amd64-cross'
        shell: bash
        env:
          LABEL: ${{ matrix.label }}
          KIND: ${{ matrix.kind }}
          VERSION: ${{ needs.meta.outputs.version }}
          MAC_NAME: ${{ matrix.mac_name }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          mkdir -p dist
          case "${KIND}" in
            macos)
              if [[ ! -d bin/hiread.app ]]; then
                echo "missing bin/hiread.app" >&2
                exit 1
              fi
              ditto -c -k --keepParent bin/hiread.app "dist/Hiread-${VERSION}-macOS-${MAC_NAME}.zip"
              mkdir -p dmgroot
              ditto bin/hiread.app dmgroot/Hiread.app
              ln -s /Applications dmgroot/Applications
              hdiutil create \
                -volname "Hiread ${MAC_NAME}" \
                -srcfolder dmgroot \
                -ov -format UDZO \
                "dist/Hiread-${VERSION}-macOS-${MAC_NAME}.dmg"
              ;;
            linux)
              found=0
              for f in bin/*.AppImage; do
                cp "$f" "dist/Hiread-${VERSION}-${LABEL}.AppImage"
                chmod +x "dist/Hiread-${VERSION}-${LABEL}.AppImage"
                found=1
              done
              for f in bin/*.deb; do
                cp "$f" "dist/Hiread-${VERSION}-${LABEL}.deb"
                found=1
              done
              for f in bin/*.rpm; do
                cp "$f" "dist/Hiread-${VERSION}-${LABEL}.rpm"
                found=1
              done
              for f in bin/*.pkg.tar.zst bin/*.pkg.tar.xz; do
                ext="${f##*.}"
                cp "$f" "dist/Hiread-${VERSION}-${LABEL}.pkg.tar.${ext}"
                found=1
              done
              if [[ ! -f bin/hiread ]]; then
                echo "missing bin/hiread" >&2
                exit 1
              fi
              tar -czf "dist/Hiread-${VERSION}-${LABEL}.tar.gz" -C bin hiread
              found=1
              if [[ "${found}" -eq 0 ]]; then
                echo "no linux artifacts collected" >&2
                exit 1
              fi
              ;;
            windows)
              if [[ ! -f bin/hiread.exe ]]; then
                echo "missing bin/hiread.exe" >&2
                exit 1
              fi
              7z a "dist/Hiread-${VERSION}-${LABEL}.zip" ./bin/hiread.exe
              installer=""
              for f in bin/*-installer.exe bin/*installer.exe; do
                installer="$f"
                break
              done
              if [[ -n "${installer}" ]]; then
                cp "${installer}" "dist/Hiread-${VERSION}-${LABEL}-setup.exe"
              else
                echo "warning: NSIS installer missing; shipping portable zip only"
                ls -la bin || true
              fi
              ;;
            *)
              echo "unknown kind ${KIND}" >&2
              exit 1
              ;;
          esac
          ls -lh dist

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: hiread-${{ matrix.label }}
          path: dist/*
          if-no-files-found: error
          retention-days: 3

  cli:
    name: Build hiread-cli
    needs: meta
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      HIREAD_VERSION: ${{ needs.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v5

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Cross-compile CLI
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          targets=(
            darwin/amd64
            darwin/arm64
            linux/amd64
            linux/arm64
            windows/amd64
            windows/arm64
          )
          for spec in "${targets[@]}"; do
            GOOS="${spec%/*}"
            GOARCH="${spec#*/}"
            out="dist/hiread-cli-${HIREAD_VERSION}-${GOOS}-${GOARCH}"
            if [[ "${GOOS}" == windows ]]; then
              out="${out}.exe"
            fi
            echo "building ${out}"
            CGO_ENABLED=0 GOOS="${GOOS}" GOARCH="${GOARCH}" \
              go build -trimpath -ldflags="-w -s" -o "${out}" ./cmd/hiread-cli
          done
          ls -lh dist

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: hiread-cli
          path: dist/*
          if-no-files-found: error
          retention-days: 3

  release:
    name: Publish GitHub Release
    needs: [meta, package, cli]
    if: ${{ always() && needs.meta.result == 'success' && needs.cli.result == 'success' && needs.package.result != 'cancelled' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      # A partial rebuild (inputs.platforms) only produces fresh copies of the
      # rebuilt assets. Pull the already-published ones back in so SHA256SUMS.txt
      # keeps covering the whole release; fresh builds win on a name clash.
      - name: Merge existing release assets into the checksum set
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.meta.outputs.tag }}
        run: |
          set -euo pipefail
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "no existing release for ${TAG}; skipping merge"
            exit 0
          fi
          mkdir -p previous
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir previous
          shopt -s nullglob
          for f in previous/*; do
            base="$(basename "$f")"
            if [[ ! -e "artifacts/${base}" ]]; then
              mv "$f" "artifacts/${base}"
            else
              echo "keeping fresh build of ${base}"
            fi
          done

      - name: Checksums
        working-directory: artifacts
        run: |
          set -euo pipefail
          sha256sum * | tee SHA256SUMS.txt
          ls -lh

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.meta.outputs.tag }}
          name: Hiread ${{ needs.meta.outputs.tag }}
          draft: false
          prerelease: ${{ needs.meta.outputs.prerelease == 'true' }}
          generate_release_notes: true
          fail_on_unmatched_files: false
          body: |
            Prebuilt installers for Hiread ${{ needs.meta.outputs.version }}.

            | Platform | Installer |
            | --- | --- |
            | macOS 12+ Apple 芯片 | `Hiread-${{ needs.meta.outputs.version }}-macOS-AppleSilicon.dmg` |
            | macOS 12+ Intel | `Hiread-${{ needs.meta.outputs.version }}-macOS-Intel.dmg` |
            | Windows 10+ (x64) | `Hiread-${{ needs.meta.outputs.version }}-windows-amd64-setup.exe` |
            | Linux x64 | `.AppImage` · `.deb` · `.rpm` · `.tar.gz` |
            | Linux ARM64 | `.AppImage` · `.deb` · `.rpm` · `.tar.gz` |

            The `hiread-cli-*` assets are the agent-facing CLI for the same local library.

            **macOS:** ad-hoc signed. First launch: right-click the app → Open.
            **Windows:** unsigned; SmartScreen may warn on first run.
            **Linux:** `.deb` / `.rpm` need GTK4 + WebKitGTK 6.0 (Ubuntu 24.04+ / Fedora current).
          files: artifacts/*
