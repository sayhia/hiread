<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="sky" x1="0.2" y1="0" x2="0.75" y2="1">
      <stop offset="0" stop-color="#3A2A12"/>
      <stop offset="0.55" stop-color="#1A140A"/>
      <stop offset="1" stop-color="#0C0906"/>
    </linearGradient>
    <radialGradient id="moonlight" cx="0.72" cy="0.22" r="0.78">
      <stop offset="0" stop-color="#F3E0A8" stop-opacity="0.28"/>
      <stop offset="0.42" stop-color="#C9A24A" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#C9A24A" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="gloss" cx="0.28" cy="0.10" r="0.90">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.16"/>
      <stop offset="0.50" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="moonFill" cx="0.38" cy="0.32" r="0.78">
      <stop offset="0" stop-color="#FFF4CC"/>
      <stop offset="0.55" stop-color="#E8C56A"/>
      <stop offset="1" stop-color="#B8862A"/>
    </radialGradient>
    <radialGradient id="moonHalo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFE9B0" stop-opacity="0.55"/>
      <stop offset="0.45" stop-color="#D4B05A" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#D4B05A" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="pageL" x1="0" y1="0" x2="1" y2="0.15">
      <stop offset="0" stop-color="#E7E0D2"/>
      <stop offset="0.55" stop-color="#F6F1E6"/>
      <stop offset="1" stop-color="#EDE4D4"/>
    </linearGradient>
    <linearGradient id="pageR" x1="0" y1="0" x2="1" y2="0.2">
      <stop offset="0" stop-color="#F3EBDA"/>
      <stop offset="0.45" stop-color="#FFF8EC"/>
      <stop offset="1" stop-color="#E8DFCC"/>
    </linearGradient>
    <radialGradient id="pageGlow" cx="0.62" cy="0.28" r="0.72">
      <stop offset="0" stop-color="#EAF3FF" stop-opacity="0.72"/>
      <stop offset="0.55" stop-color="#C9DCF4" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#C9DCF4" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cover" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6B7C94"/>
      <stop offset="1" stop-color="#3D4A5E"/>
    </linearGradient>
    <linearGradient id="gutter" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8A7B64" stop-opacity="0"/>
      <stop offset="0.48" stop-color="#6A5C48" stop-opacity="0.28"/>
      <stop offset="0.52" stop-color="#6A5C48" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#8A7B64" stop-opacity="0"/>
    </linearGradient>
    <filter id="lift" x="-35%" y="-35%" width="170%" height="170%">
      <feDropShadow dx="0" dy="22" stdDeviation="26" flood-color="#02060E" flood-opacity="0.48"/>
    </filter>
    <filter id="moonSoft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="1.2"/>
    </filter>
    <mask id="crescent">
      <circle cx="708" cy="248" r="96" fill="#fff"/>
      <circle cx="666" cy="228" r="82" fill="#000"/>
    </mask>
    <clipPath id="round">
      <rect width="1024" height="1024" rx="228"/>
    </clipPath>
  </defs>

  <g clip-path="url(#round)">
    <rect width="1024" height="1024" fill="url(#sky)"/>
    <rect width="1024" height="1024" fill="url(#moonlight)"/>

    <!-- faint stars -->
    <g fill="#E8F0FF">
      <circle cx="148" cy="168" r="3.2" opacity="0.55"/>
      <circle cx="236" cy="292" r="2.2" opacity="0.35"/>
      <circle cx="318" cy="128" r="2.6" opacity="0.42"/>
      <circle cx="412" cy="214" r="1.8" opacity="0.28"/>
      <circle cx="486" cy="96" r="2.4" opacity="0.38"/>
      <circle cx="560" cy="178" r="1.6" opacity="0.22"/>
      <circle cx="882" cy="142" r="2.8" opacity="0.40"/>
      <circle cx="940" cy="268" r="2.0" opacity="0.30"/>
      <circle cx="128" cy="400" r="1.8" opacity="0.22"/>
      <circle cx="868" cy="388" r="2.2" opacity="0.26"/>
    </g>

    <!-- moon + halo -->
    <circle cx="708" cy="248" r="168" fill="url(#moonHalo)"/>
    <circle cx="708" cy="248" r="96" fill="url(#moonFill)" mask="url(#crescent)" filter="url(#moonSoft)"/>

    <!-- open book -->
    <g filter="url(#lift)">
      <path d="M196 796 C210 848 812 848 828 796 L812 768 C700 804 324 804 212 768 Z" fill="url(#cover)"/>
      <path d="M198 586
               C206 552 248 538 292 532
               L500 516
               L510 792
               C400 812 276 816 220 798
               C188 786 190 620 198 586 Z" fill="url(#pageL)"/>
      <path d="M524 516
               L732 532
               C776 538 818 552 826 586
               C834 620 836 786 804 798
               C748 816 624 812 514 792
               Z" fill="url(#pageR)"/>
      <path d="M524 516
               L732 532
               C776 538 818 552 826 586
               C834 620 836 786 804 798
               C748 816 624 812 514 792
               Z" fill="url(#pageGlow)"/>
      <path d="M498 520 L526 520 L518 796 L506 796 Z" fill="url(#gutter)"/>

      <!-- type lines, left page -->
      <g fill="#6B6254" fill-opacity="0.22">
        <path d="M268 578 L456 564 L458 576 L270 590 Z"/>
        <path d="M262 612 L448 598 L450 610 L264 624 Z"/>
        <path d="M258 646 L430 634 L432 646 L260 658 Z"/>
        <path d="M256 680 L442 666 L444 678 L258 692 Z"/>
        <path d="M254 714 L404 704 L406 716 L256 726 Z"/>
        <path d="M258 748 L388 740 L390 752 L260 760 Z"/>
      </g>
      <!-- type lines, right page -->
      <g fill="#6B6254" fill-opacity="0.18">
        <path d="M568 564 L756 578 L754 590 L566 576 Z"/>
        <path d="M576 598 L762 612 L760 624 L574 610 Z"/>
        <path d="M594 632 L766 646 L764 658 L592 644 Z"/>
        <path d="M582 666 L768 680 L766 692 L580 678 Z"/>
        <path d="M620 700 L770 714 L768 726 L618 712 Z"/>
        <path d="M636 734 L766 748 L764 760 L634 746 Z"/>
      </g>
    </g>

    <rect width="1024" height="1024" fill="url(#gloss)"/>
  </g>
</svg>
